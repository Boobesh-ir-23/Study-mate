name = "studymate"
main = "worker.js"
compatibility_date = "2024-09-01"

[build]
command = "node build.js"

# Key-Value store for File System hierarchy, sticky notes & suggestions
[[kv_namespaces]]
binding = "FILES_DB"
id = "48e1af0f095e413fbeef52f2a5bd5aa3"
preview_id = "your-kv-preview-id"

# Cloudflare R2 bucket for zero-egress binary storage (PDFs, PPTs, Images)
# (Enable R2 on Cloudflare Dashboard to bind personal-lms-files)
# [[r2_buckets]]
# binding = "FILES_BUCKET"
# bucket_name = "personal-lms-files"
# preview_bucket_name = "personal-lms-files-preview"

# Default environment variables (Non-sensitive)
[vars]
ENVIRONMENT = "production"
DEFAULT_THEME = "dark"
ADMIN_PASSWORD = "admin"
